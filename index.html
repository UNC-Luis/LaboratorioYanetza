:root{
  color-scheme: dark;
  --bg:#0a1228; --bg2:#0e1834; --card:#132046; --card2:#1a2a58; --line:#2a3e78; --ink:#eef3ff; --mute:#a7b6dc; --dim:#7081b0;
  --amber:#ffb547; --good:#2ee6a6; --bad:#ff7a7a; --ribo:#8fa2ff;
  --A:#ff6b6b; --T:#ffd166; --G:#2ee6a6; --C:#4dabf7; --U:#b197fc;
  --f-d:'Bricolage Grotesque', system-ui, sans-serif;
  --f-b:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-m:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --hb:58px;
}
*{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100% }
body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 var(--f-b); min-height:100vh; min-height:100dvh; overflow-x:hidden }
body::before{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(110% 55% at 50% -12%, #1c3170 0%, rgba(28,49,112,0) 62%), radial-gradient(60% 40% at 0% 105%, rgba(46,230,166,.06), rgba(46,230,166,0) 70%) }
button{ font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent }
button:disabled{ cursor:default }
:focus-visible{ outline:3px solid var(--amber); outline-offset:2px }
[hidden]{ display:none !important }
h1,h2,h3,h4,p,dl,dd{ margin:0 }
.ic{ width:20px; height:20px; flex:none }
.mute{ color:var(--mute) } .small{ font-size:14px } .mono{ font-family:var(--f-m) }

/* bar */
.bar{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:8px; height:var(--hb); padding:0 var(--gr) 0 var(--gl);
  background:rgba(10,18,40,.9); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid rgba(42,62,120,.65) }
.brand{ flex:1; min-width:0; display:flex; align-items:center; gap:9px; background:none; border:0; padding:0; text-align:left; font:800 19px/1 var(--f-d); white-space:nowrap; overflow:hidden }
.brand span:last-child{ overflow:hidden; text-overflow:ellipsis }
.logo{ width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(135deg, #2ee6a6, #4dabf7); color:#0a1228; flex:none }
.logo .ic{ width:22px; height:22px; stroke-width:2.2 }
.bar-r{ display:flex; gap:6px; flex:none }
.ib{ height:40px; min-width:40px; padding:0 9px; border-radius:12px; border:1px solid var(--line); background:var(--card); display:inline-flex; align-items:center; justify-content:center }
.ib:hover{ background:var(--card2) }
.ib.pill{ font:700 14px/1 var(--f-b); letter-spacing:.04em }
#app{ padding:0 var(--gr) 0 var(--gl) }
.col{ max-width:720px; margin:0 auto; padding:18px 0 0 }

/* buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:12px 18px; border-radius:16px; border:1px solid var(--line); background:var(--card); font-weight:700; font-size:16px }
.btn:hover{ background:var(--card2) }
.btn.primary{ background:var(--amber); border-color:var(--amber); color:#1a1200; box-shadow:inset 0 -4px 0 rgba(0,0,0,.18) }
.btn.primary:hover{ background:#ffc266 }
.btn.primary:disabled{ opacity:.45 }
.btn.big{ width:100%; min-height:56px; font-size:17px; font-family:var(--f-d) }
.btn.danger{ border-color:rgba(255,122,122,.6); color:#ffb3b3 }
.btn.danger.arm{ background:rgba(255,122,122,.18) }
.lnk{ background:none; border:0; color:var(--mute); display:inline-flex; align-items:center; gap:6px; padding:8px 0; font-size:14px; text-decoration:underline; text-underline-offset:3px }
.lnk .ic{ width:16px; height:16px }
.stick{ position:sticky; bottom:0; padding:12px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background:linear-gradient(to bottom, rgba(10,18,40,0), var(--bg) 16px); margin-top:14px }

/* home */
.kick{ font:700 12px/1.2 var(--f-b); letter-spacing:.13em; text-transform:uppercase; color:var(--amber) }
.h1{ font:800 clamp(38px, 11vw, 62px)/.95 var(--f-d); letter-spacing:-.03em; margin:10px 0 8px }
.h1 em{ font-style:normal; background:linear-gradient(90deg, #2ee6a6, #4dabf7); -webkit-background-clip:text; background-clip:text; color:transparent }
.byline{ font-size:15px; color:var(--mute); margin:0 0 10px } .byline b{ color:var(--ink) }
.lead{ font-size:17px; color:var(--mute) }
.preview{ margin:18px 0 6px }
.preview figcaption{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--mute); margin-top:8px }
.preview .dot{ width:9px; height:9px; border-radius:50%; background:#ff5c5c; box-shadow:0 0 0 0 rgba(255,92,92,.6); animation:live 1.6s infinite }
.sec{ font:800 22px/1.2 var(--f-d); margin:24px 0 10px; display:flex; align-items:baseline; gap:8px }
.sec .mute{ font:700 15px var(--f-b) }
.plist{ list-style:none; padding:0; margin:0; display:grid; gap:10px }
.pcard{ width:100%; display:grid; grid-template-columns:52px 1fr auto; gap:13px; align-items:center; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:11px 13px 11px 11px }
.pcard:hover{ background:var(--card2) }
.hex{ width:52px; height:58px; display:grid; place-items:center; background:var(--pc); color:#0a1228; clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%) }
.hex .ic{ width:26px; height:26px; stroke-width:2.2 }
.hex.sm{ width:40px; height:44px; flex:none } .hex.sm .ic{ width:21px; height:21px }
.ptxt{ display:flex; flex-direction:column; gap:2px; min-width:0 }
.ptop{ font:700 11.5px/1 var(--f-b); letter-spacing:.09em; text-transform:uppercase; color:var(--mute) }
.pt{ font:800 18px/1.15 var(--f-d) }
.pm{ font-size:13.5px; color:var(--mute) }
.pst{ font:700 13px var(--f-b); padding:7px 10px; border-radius:999px; background:var(--bg2); border:1px solid var(--line); white-space:nowrap; display:inline-flex; align-items:center; gap:4px }
.pst.on{ background:rgba(46,230,166,.14); border-color:rgba(46,230,166,.5); color:var(--good) }
.pst .ic{ width:15px; height:15px; stroke-width:3 }
.links{ display:grid; gap:10px; margin:18px 0 8px }
.foot{ font-size:13px; color:var(--dim); text-align:center; padding:12px 0 24px }

/* stage */
.stage{ position:relative; width:100%; aspect-ratio:5 / 4; border-radius:18px; overflow:hidden; background:#060c1e; border:1px solid var(--line); box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.03) }
.stage.demo{ cursor:pointer }
.simcv{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation }
.hud{ position:absolute; top:8px; display:flex; gap:6px; align-items:center; z-index:2 }
.hud.tl{ left:8px; flex-direction:column; align-items:flex-start; gap:3px }
.hud.tr{ right:8px }
.spec{ display:inline-flex; align-items:center; gap:5px; font:700 12.5px/1 var(--f-b); background:rgba(10,18,40,.82); border:1px solid rgba(167,182,220,.3); padding:5px 8px; border-radius:9px }
.spec .ic{ width:15px; height:15px }
.clock{ font:700 11.5px/1 var(--f-m); color:var(--mute); background:rgba(10,18,40,.7); padding:4px 7px; border-radius:7px }
.hb{ height:34px; min-width:34px; padding:0 8px; border-radius:10px; border:1px solid rgba(167,182,220,.35); background:rgba(10,18,40,.82); display:inline-flex; align-items:center; gap:3px; font:800 13px/1 var(--f-b) }
.hb .ic{ width:16px; height:16px }
.hb.on{ border-color:var(--amber); color:var(--amber) }
.hb.need{ border-color:var(--amber); box-shadow:0 0 0 3px rgba(255,181,71,.35); animation:needp 1.2s infinite }
.info{ position:absolute; left:8px; right:8px; bottom:8px; z-index:3; background:rgba(10,18,40,.94); border:1px solid rgba(143,162,255,.55); border-radius:12px; padding:9px 12px; display:grid; gap:2px; font-size:13.5px; line-height:1.3; animation:up .2s ease-out }
.info b{ font:800 14.5px var(--f-d); color:#c9d3ff }

/* lab layout */
.labwrap{ max-width:1240px; margin:0 auto; padding-top:10px }
.stagecol{ position:sticky; top:var(--hb); z-index:5; background:var(--bg); padding:8px 0 8px; margin:0 -2px }
.stagecol .stage{ width:min(100%, calc(42vh * 1.25)); width:min(100%, calc(42dvh * 1.25)); margin:0 auto }
.meters{ display:grid; grid-template-columns:repeat(var(--n, 4), minmax(0, 1fr)); gap:6px; margin:8px auto 0; width:min(100%, 640px) }
.meter{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px 8px 7px; display:flex; flex-direction:column; gap:1px; min-width:0 }
.ml{ font:700 10.5px/1.15 var(--f-b); color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.mv{ font:800 18px/1.1 var(--f-d); color:var(--mc) }
.ms{ font-size:10.5px; color:var(--mute); line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.mb{ height:4px; border-radius:2px; background:rgba(167,182,220,.15); overflow:hidden; margin-top:3px }
.mb i{ display:block; height:100%; background:var(--mc); border-radius:2px; transition:width .2s }
.panelcol{ display:grid; gap:12px; padding:6px 0 0 }
.card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px }

/* step card */
.sch{ display:flex; gap:12px; align-items:center }
.st{ font:800 21px/1.15 var(--f-d); margin-top:3px }
.stopic{ font-size:13.5px; color:var(--mute); margin-top:2px }
.phases{ list-style:none; padding:0; margin:14px 0 14px; display:grid; grid-template-columns:repeat(5, 1fr); gap:4px }
.phases li{ font:700 10.5px/1.15 var(--f-b); color:var(--dim); display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center }
.phases span{ width:24px; height:24px; border-radius:50%; display:grid; place-items:center; border:1.5px solid var(--line); font:800 12px var(--f-d) }
.phases li.on{ color:var(--mute) } .phases li.on span{ background:var(--good); border-color:var(--good); color:#0a1228 }
.phases li.now{ color:var(--amber) } .phases li.now span{ border-color:var(--amber); background:rgba(255,181,71,.18); color:var(--amber) }

/* ---------- tap info (hit test) ---------- */
function hitTest(sx, sy) {
  if (S.div || inMitosis()) return null;
  const p = screenToCell(sx, sy), es = ES();
  const near = (x, y, r) => Math.hypot(p.x - x, p.y - y) < r;
  const I = (es, en, des, den) => ({ t: ES() ? es : en, d: ES() ? des : den });
  if (S.spec === 'human') {
    for (const b of S.bubbles) if (near(b.x, b.y, 22)) return I('Burbuja de oxígeno', 'Oxygen bubble', 'La catalasa rompe el agua oxigenada: 2 H₂O₂ → 2 H₂O + O₂.', 'Catalase breaks down hydrogen peroxide: 2 H₂O₂ → 2 H₂O + O₂.');
    for (const q of S.pols) if (near(lerp(HUM.gene.x0, HUM.gene.x1, q.s), HUM.gene.y, 26)) return I('ARN polimerasa', 'RNA polymerase', 'Recorre el gen y copia su información en ARN mensajero (transcripción).', 'Moves along the gene copying it into messenger RNA (transcription).');
    if (p.x > HUM.gene.x0 - 10 && p.x < HUM.gene.x1 + 10 && Math.abs(p.y - HUM.gene.y) < 22) return I('Gen de la catalasa', 'Catalase gene', 'Un fragmento de ADN con las instrucciones para fabricar la enzima catalasa.', 'A stretch of DNA with the instructions to build the enzyme catalase.');
    for (const r of S.mrnas) { if (r.dying) continue; for (const s of r.rib) { const q = mrnaPoint(r, clamp(s, 0.02, 0.98)); if (near(q.x, q.y, 20)) return I('Ribosoma', 'Ribosome', 'Lee el ARNm de 3 en 3 letras (codones) y une aminoácidos para formar la proteína (traducción).', 'Reads the mRNA 3 letters at a time (codons) and links amino acids into a protein (translation).'); } const q = mrnaPoint(r, 0.5); if (near(q.x, q.y, 40)) return I('ARN mensajero (ARNm)', 'Messenger RNA (mRNA)', 'Copia del gen que sale del núcleo por un poro y llega a los ribosomas.', 'Copy of the gene that leaves the nucleus through a pore and reaches the ribosomes.'); }
    for (const q of S.prots) if (near(q.x, q.y, 20)) return q.st === 'den' ? I('Catalasa desnaturalizada', 'Denatured catalase', 'El calor la desplegó: perdió su forma y ya no funciona.', 'Heat unfolded it: it lost its shape and no longer works.') : I('Catalasa', 'Catalase', 'Enzima formada por 4 cadenas. Protege a la célula descomponiendo el agua oxigenada.', 'An enzyme made of 4 chains. It protects the cell by breaking down hydrogen peroxide.');
    if (near(HUM.nuc.x, HUM.nuc.y, HUM.nuc.r)) return I('Núcleo', 'Nucleus', 'Guarda el ADN. Tiene poros por donde sale el ARNm.', 'Stores the DNA. Its pores let the mRNA out.');
    for (const m of S.decor.mito) if (near(m.x, m.y, 50)) return I('Mitocondria', 'Mitochondrion', 'Produce la energía (ATP) que usan todos estos procesos.', 'Makes the energy (ATP) all these processes use.');
    if (Math.abs(Math.hypot(p.x, p.y) - HUM.R) < 26) return I('Membrana celular', 'Cell membrane', 'Rodea la célula y controla lo que entra y sale.', 'Surrounds the cell and controls what goes in and out.');
  } else {
    if (near(BAC.pl.x, BAC.pl.y, BAC.pl.r + 22)) return I('Plásmido pGLO', 'pGLO plasmid', 'ADN circular extra con el gen GFP. Un interruptor solo lo enciende si hay arabinosa.', 'Extra circular DNA carrying the GFP gene. A switch turns it on only when arabinose is present.');
    for (const q of S.prots) if (q.g === 'gfp' && near(q.x, q.y, 20)) return I('Proteína GFP', 'GFP protein', 'Proteína verde fluorescente de una medusa: brilla con luz UV.', 'Green fluorescent protein from a jellyfish: it glows under UV light.');
    for (const r of S.mrnas) { const q = mrnaPoint(r, 0.5); if (near(q.x, q.y, 40)) return I('ARNm con ribosomas', 'mRNA with ribosomes', 'En las bacterias no hay núcleo: los ribosomas traducen el ARNm mientras se fabrica.', 'Bacteria have no nucleus: ribosomes translate the mRNA while it is being made.'); }
    if (near(BAC.nucl.x, BAC.nucl.y, 120)) return I('Nucleoide', 'Nucleoid', 'El cromosoma circular de la bacteria, sin membrana alrededor.', 'The bacterium’s circular chromosome, with no membrane around it.');
    if (inBact(p.x, p.y, 0)) return I('Citoplasma bacteriano', 'Bacterial cytoplasm', 'Lleno de ribosomas 70S, diferentes de los nuestros (80S).', 'Full of 70S ribosomes, different from ours (80S).');
    if (Math.abs(p.x) > BAC.a + BAC.r) return I('Flagelo', 'Flagellum', 'Una cola que gira como hélice para nadar.', 'A tail that spins like a propeller to swim.');
  }
  return null;
}

function freshCulture(spec) {
  const r = G.run;

/* ---------- chart ---------- */
function drawChart() {
  const c = $('#chart'); if (!c) return;
  const box = c.parentElement, w = box.clientWidth, h = box.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  if (!w || !h) return;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#0b1430'; g.fillRect(0, 0, w, h);
  const keys = seriesFor(), hist = S.hist, span = 70;
  const tEnd = Math.max(S.t, span * 0.25), t0 = Math.max(0, tEnd - span), padL = 8, padR = 8, padT = 22, padB = 20;
  const X = tt => padL + (tt - t0) / (tEnd - t0 || 1) * (w - padL - padR), Y = v => h - padB - v * (h - padT - padB);
  g.strokeStyle = 'rgba(167,182,220,0.14)'; g.lineWidth = 1;
  for (const v of [0, 0.5, 1]) { g.beginPath(); g.moveTo(padL, Y(v)); g.lineTo(w - padR, Y(v)); g.stroke(); }
  g.fillStyle = 'rgba(167,182,220,0.7)'; g.font = '600 10.5px Atkinson Hyperlegible, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  for (let s = Math.ceil(t0 / 10) * 10; s <= tEnd; s += 10) { const x = X(s); if (x < padL + 12 || x > w - padR - 12) continue; g.fillText(s + ' s', x, h - 5); }
  for (const ev of S.events) {
    if (ev.t < t0) continue; const x = X(ev.t);
    g.strokeStyle = hexA(ev.c, 0.8); g.setLineDash([4, 4]); g.beginPath(); g.moveTo(x, padT - 4); g.lineTo(x, h - padB); g.stroke(); g.setLineDash([]);
    const lab = tx(ev.label); g.font = '700 10.5px Atkinson Hyperlegible, sans-serif'; const tw = g.measureText(lab).width + 8;
    const lx = clamp(x, tw / 2 + 2, w - tw / 2 - 2); g.fillStyle = hexA(ev.c, 0.92); rr(g, lx - tw / 2, 3, tw, 16, 5); g.fill(); g.fillStyle = '#0a1228'; g.fillText(lab, lx, 15);
  }
  const vis = hist.filter(q => q.t >= t0 - 1);
  for (const k of keys) {
    const s = SERIES[k], mx0 = typeof s.max === 'function' ? s.max() : s.max;
    let mx = mx0; for (const q of vis) mx = Math.max(mx, s.v(q) * 1.05);
    g.beginPath(); let first = true;
    for (const q of vis) { const x = X(q.t), y = Y(clamp(s.v(q) / mx, 0, 1.05)); if (first) { g.moveTo(x, y); first = false; } else g.lineTo(x, y); }
    g.lineWidth = 2.6; g.lineJoin = 'round'; g.strokeStyle = s.c; g.stroke();
  }
  const lg = $('#legend'); const last = hist[hist.length - 1] || {};
  if (lg) lg.innerHTML = keys.map(k => { const s = SERIES[k]; let v = s.v(last); v = k === 'dna' ? fmtN(v + 1, 1) + '×' : k === 'o2' ? fmtN(v, 1) : Math.round(v); return `<span><i style="background:${s.c}"></i>${t(s.l)} <b>${v}</b></span>`; }).join('');
}

}
let last = performance.now();
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  const dt = paused ? 0 : real * speed;
  if (dt > 0) update(dt);
  if (cv.isConnected && cv.width) { const dpr = Math.min(2, window.devicePixelRatio || 1); drawScene(ctx, cv.width / dpr, cv.height / dpr, dpr, G.screen === 'lab' ? 'lab' : 'demo'); }
  if (G.screen === 'lab') {

    if (now - lastUI > 200) { lastUI = now; updateMeters(); updateHUD(); drawChart(); const tb = $('#tbar'); if (tb && G.run) tb.style.width = Math.round((G.run.prog || 0) * 100) + '%'; }
    if (infoTimer && now > infoTimer) { infoTimer = 0; const i = $('#info'); if (i) i.hidden = true; }
  }
  requestAnimationFrame(frame);
}
function checkTasks(dt) {
  const r = G.run; if (!r || !r.pr || r.phase !== 'run') return;
  const tk = r.pr.tasks[r.ti]; if (!tk) return;
  r.tk.dt = dt; const res = tk.check(r.tk); r.prog = res.prog;
  if (res.done) {
    if (tk.onDone) tk.onDone(r.marks);
    r.ti++; r.tk = {}; r.prog = 0; sfx('task');
    if (r.ti >= r.pr.tasks.length) finishRun();

}

}

  <p>A virtual lab for a session of about <b>45 minutes</b>. Every practice follows the scientific method: <b>question → hypothesis → experiment → analysis → conclusion</b>. Results (with their chart) are saved to each device’s lab notebook.</p>
  <h2>Session plan</h2><table class="gtable"><tr><th>Min</th><th>Practice</th><th>Key idea</th></tr>
  <tr><td>0–3</td><td>Intro</td><td>Tour the cell: tap the nucleus, gene, RNA polymerase, mRNA, ribosome, protein.</td></tr>
  <tr><td>3–10</td><td>1 · Hydroxyurea</td><td>A cell copies its DNA before dividing; without a copy, a checkpoint stops it.</td></tr>
  <tr><td>10–17</td><td>2 · α-amanitin</td><td>No transcription means no mRNA; protein falls later because it lasts longer.</td></tr>
  <tr><td>17–25</td><td>3 · Tetracycline</td><td>70S vs 80S ribosomes: why antibiotics are selective.</td></tr>
  <tr><td>25–32</td><td>4 · pGLO + arabinose</td><td>Genes switch on and off; there’s a delay gene → mRNA → protein.</td></tr>
  <tr><td>32–40</td><td>5 · Catalase and heat</td><td>Shape = function; cold is reversible, denaturation is not.</td></tr>
  <tr><td>40–45</td><td>6 · UV and sunscreen</td><td>UV causes mutations; repair and sunscreen reduce them.</td></tr></table>
  <h2>Tips</h2><ul><li>Works on phones, tablets and computers. In pairs: one runs the lab, the other writes in the notebook.</li><li>⏩ speeds up time (×1, ×2, ×4). Time is accelerated: a few seconds on screen stand for minutes or hours.</li><li>Tapping any part of the cell explains what it is. “Aa” toggles the labels.</li><li>The <b>free lab</b> combines everything: great for open questions or projecting in class.</li><li>ES/EN switches language; you can also open with <span class="mono">?lang=es</span>.</li></ul>
  <h2>Expected answers</h2>
  <div class="ans"><h4>1 · Hydroxyurea</h4><p>Expected hypothesis: it stops before dividing. Result: DNA stays at 1×, the cell halts in S phase (the checkpoint appears) and doesn’t divide again. Question: DNA stayed at 1× and the cell stopped.</p></div>
  <div class="ans"><h4>2 · α-amanitin</h4><p>Expected hypothesis: mRNA drops first. Result: RNA polymerases turn grey; mRNA falls within seconds and proteins decline more slowly. Question: mRNA dropped first, then protein.</p></div>
  <div class="ans"><h4>3 · Tetracycline</h4><p>Expected hypothesis: only the bacterium. Result: the human cell barely changes; in the bacterium ribosomes turn grey, proteins drop and the population stops growing. Question: 70S ribosomes differ from 80S.</p></div>
  <div class="ans"><h4>4 · pGLO</h4><p>Expected hypothesis: it glows after a while. Result: no glow without arabinose; with arabinose GFP mRNA rises first, then ready GFP. Question: transcribe, translate and fold.</p></div>
  <div class="ans"><h4>5 · Catalase</h4><p>Expected hypothesis: they don’t come back. Result: bubbles at 37 °C, very few at 4 °C, back at 37 °C; at 70 °C proteins unfold, the cell dies and no bubbles return after cooling. Question: heat denatures; cold only slows.</p></div>
  <div class="ans"><h4>6 · UV</h4><p>Expected hypothesis: fewer mutations. Result: without sunscreen, damage (red) appears and is almost always repaired, with at least one mutation (yellow star); with SPF 50 there’s hardly any damage. Sequence: UCC → UUC (Ser → Phe), a missense mutation.</p></div>
  <h2>Model simplifications</h2><ul><li>Molecule counts are kept small so you can see them; real cells have thousands.</li><li>Catalase works inside peroxisomes; here it sits in the cytoplasm for simplicity.</li><li>At high doses tetracycline can affect mitochondria; that isn’t shown.</li><li>The real pGLO lab uses a bacterial colony on an arabinose plate, and catalase is usually tested with liver and hydrogen peroxide.</li></ul>`
};
function renderGuide() {
  app.innerHTML = `<div class="col guide">${GUIDE[G.saved.lang]}
    <h2>${t(L('Borrar el cuaderno', 'Clear the notebook'))}</h2><p class="mute small">${t(L('Borra los resultados y el nombre guardados en este dispositivo.', 'Clears the results and name saved on this device.'))}</p>
    <button class="btn danger" type="button" data-act="clear">${t(L('Borrar cuaderno', 'Clear notebook'))}</button>
    <div class="stick"><button class="btn big" type="button" data-act="home">${t(UI.home)}</button></div></div>`;
}

/* ---------- events ---------- */
let clearArmed = false;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-p],[data-add],[data-spec],[data-temp],[data-pred],[data-qopt]');
  if (!el || el.disabled) return;
  actx();
  const d = el.dataset, r = G.run;
  if (d.p) return startPractice(d.p);
  if (d.add) { if (addReagent(d.add)) { sfx('drop'); updateTools(); } return; }
  if (d.spec) { if (S.spec !== d.spec) { freshCulture(d.spec); sfx('click'); updateTools(); updateMeters(); drawChart(); } return; }
  if (d.temp) { setTemp(+d.temp); sfx('click'); updateTools(); return; }
  if (d.pred != null) { r.pred = +d.pred; sfx('click'); updateStep(); return; }
  if (d.qopt != null) {
    const i = +d.qopt, o = r.pr.question.options[i]; if (r.picked.includes(i)) return;
    r.picked.push(i);
    if (o.ok) { r.qDone = true; sfx('good'); } else sfx('bad');
    updateStep(); return;
  }
  const a = d.act;
  if (a !== 'clear') clearArmed = false;
  if (a === 'home') go('home');
  else if (a === 'free') startFree();
  else if (a === 'notebook') go('notebook');
  else if (a === 'guide') go('guide');
  else if (a === 'lang') { G.saved.lang = ES() ? 'en' : 'es'; save(); render(); }
  else if (a === 'sound') { G.saved.sound = !G.saved.sound; save(); header(); }
  else if (a === 'labels') { S.labels = !S.labels; updateHUD(); }
  else if (a === 'speed') { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; updateHUD(); }
  else if (a === 'pause') { paused = !paused; updateHUD(); }
  else if (a === 'uv') { setUV(!S.uv); sfx('click'); updateTools(); }
  else if (a === 'wash') { if (wash()) sfx('drop'); updateTools(); }
  else if (a === 'reset') { freshCulture(S.spec); updateTools(); drawChart(); }
  else if (a === 'cycle') { S.cycOn = !S.cycOn; updateTools(); }
  else if (a === 'toPredict') { r.phase = 'predict'; updateStep(); }
  else if (a === 'toRun') { if (r.pred < 0) return; r.phase = 'run'; r.ti = 0; r.tk = {}; r.marks = {}; freshCulture(); if (VIEW.cw && VIEW.cw < 520) S.labels = false; paused = false; updateStep(); updateTools(); drawChart(); }
  else if (a === 'restartExp') { r.ti = 0; r.tk = {}; r.marks = {}; freshCulture(); if (VIEW.cw && VIEW.cw < 520) S.labels = false; updateStep(); updateTools(); drawChart(); }
  else if (a === 'seq') { S.seqDone = true; sfx('good'); }
  else if (a === 'toDone') { r.phase = 'done'; savePractice(); sfx('win'); updateStep(); scrollToStep(); }
  else if (a === 'clear') {
    if (!clearArmed) { clearArmed = true; el.classList.add('arm'); el.textContent = t(L('¿Seguro? Toca otra vez', 'Sure? Tap again')); return; }
    clearArmed = false; G.saved.notes = {}; G.saved.name = ''; save(); el.classList.remove('arm'); el.textContent = t(L('Cuaderno borrado ✓', 'Notebook cleared ✓'));
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'nameIn') { G.saved.name = e.target.value; save(); }
  if (e.target.id === 'tempR') { setTemp(+e.target.value); const b = $('.temp .tl b'); if (b) b.textContent = S.T + ' °C'; document.querySelectorAll('.tchips button').forEach(x => x.classList.toggle('on', +x.dataset.temp === S.T)); }
});
document.addEventListener('keydown', e => {
  if (G.screen !== 'lab' || (e.target.matches && e.target.matches('input, textarea'))) return;
  if (e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); paused = !paused; updateHUD(); }
});
let downXY = null;
cv.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; });
cv.addEventListener('pointerup', e => {
  if (G.screen !== 'lab' || !downXY || Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 10) return;
  const rc = cv.getBoundingClientRect(), hit = hitTest(e.clientX - rc.left, e.clientY - rc.top), box = $('#info'); if (!box) return;
  if (!hit) { box.hidden = true; return; }
  box.innerHTML = `<b>${hit.t}</b><span>${hit.d}</span>`; box.hidden = false; infoTimer = performance.now() + 6500;
});
cv.addEventListener('click', () => { if (G.screen === 'home') startFree(); });

window.LAB = { G, S, PRACTICES, startPractice, startFree, go, update, counts, setSpeed: v => { speed = v; } };
render();
requestAnimationFrame(frame);

</script>
